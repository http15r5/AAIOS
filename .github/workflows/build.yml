name: Build Husk IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          for app in /Applications/Xcode_16*.app; do
            if [ -d "$app" ]; then
              echo "==> Selecting $app"
              sudo xcode-select -s "$app"
              break
            fi
          done
          xcodebuild -version

      - name: Set up tools
        run: |
          brew install xcodegen qemu
          chmod +x scripts/*.sh

      - name: Download official release assets and stage frameworks
        run: |
          ./scripts/setup_prebuilt.sh

      - name: Build pairing library
        run: |
          ./scripts/build_rppairing_ios.sh

      - name: Build Husk App with custom Translation Layer
        run: |
          (cd src/app && xcodegen generate)
          xcodebuild -project src/app/Husk.xcodeproj -scheme Husk \
            -sdk iphoneos -configuration Release -derivedDataPath /tmp/husk_derived \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          ./scripts/package_overlay_ipa.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Husk-IPA
          path: output/*

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ github.run_number }}
          name: Husk Build #${{ github.run_number }}
          body: |
            ## Husk with Custom Translation Layer & Universal APK Support
            - **Husk.ipa**: Standard IPA for SideStore, AltStore, Sideloadly
            - **Husk.tipa**: TrollStore package with JIT-less & dynamic ARM64 stubs
          files: |
            output/Husk.ipa
            output/Husk.tipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

